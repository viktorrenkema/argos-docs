$schema: https://api.gitbook.com/openapi.yaml#/components/schemas/GitSyncSiteConfig
site:
  title: Argos Docs (Hive v2)
  structure:
    - type: section
      key: section-1
      title: Argos Docs (Hive v2)
      path: argos-docs-hive-v2
      default: true
      children:
        - type: space
          key: space-1
          title: Documentation
          path: argos-docs
          default: true
          content:
            directory: ./argos-docs
    - type: section
      key: section-2
      title: Changelog
      path: changelog
      icon: burst-new
      children:
        - type: space
          key: space-2
          title: Changelog
          path: changelog
          default: true
          draft: true
          content:
            directory: ./changelog
